<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard estadístico de KPIs</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202b;--mute:#5d6b7a;--line:#d8dee5;--acc:#0b6b8a;--good:#dff3e6;--goodink:#14653a;--warn:#fdeccf;
--s0:#1f77b4;--s1:#e08a1e;--s2:#2e9e5b;--s3:#b23a7f;--s4:#6b5bd2;--s5:#8a6d3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--ink:#e6edf3;--mute:#94a3b3;--line:#2b3846;--acc:#5cc0df;--good:#173a27;--goodink:#7fdcA5;--warn:#4a3813}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--ink:#e6edf3;--mute:#94a3b3;--line:#2b3846;--acc:#5cc0df;--good:#173a27;--goodink:#7fdca5;--warn:#4a3813}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mute);gap:3px;flex:1;min-width:130px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;resize:vertical}
button.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.b:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{font-size:.8rem;color:var(--mute);margin:6px 0 0}
.err{color:#c0392b;font-size:.85rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-weight:600}
td.best{background:var(--good);color:var(--goodink);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.ins{margin:0;padding-left:18px}.ins li{margin:3px 0}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mute);font:11px system-ui,sans-serif}
svg .ax{stroke:var(--line)}
.cap{font-size:.82rem;color:var(--mute);margin:6px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;margin-bottom:6px}
.num{width:72px;text-align:right}.j{width:100%;min-width:200px}td span.cap{font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;color:var(--mute)}.chip.ok{background:var(--good);color:var(--goodink);border-color:transparent}
[hidden]{display:none!important}
.steps{margin:0;padding-left:22px}.steps li{margin:0 0 16px}.steps p{margin:3px 0}
.fm{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.vd{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:8px;font-weight:700}.vd.rej{background:var(--warn);color:var(--ink)}.vd.keep{background:var(--good);color:var(--goodink)}
.hg{margin-top:8px;max-width:700px}.dt{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px}.dt summary{cursor:pointer;font-weight:600}
.vtabs{margin:6px 0 14px}
#hsaved td:nth-child(2),#hsaved th:nth-child(2),#hsaved th:nth-child(3){text-align:left}
button.b:disabled{opacity:.5;cursor:not-allowed}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.pk{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.pk:hover{border-color:var(--acc)}.pk.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset;background:var(--card)}
.pn{width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-bottom:2px}.pt{font-weight:700}.ps{font-size:.78rem;color:var(--mute)}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0}.dc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}.dc span{display:block;font-size:.78rem;color:var(--mute)}.dc b{font-size:.95rem;overflow-wrap:anywhere}
.fb{border-left:4px solid var(--acc);background:var(--bg);border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0}.fl{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);font-weight:700}
.mx{font-size:1.05rem;padding:6px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mx.res{font-weight:700}.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;text-align:center}.fr>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 4px 2px}.fr>span:last-child{padding:2px 4px 0}
</style>
</head>
<body>
<main>
<h1>Dashboard estadístico de KPIs</h1>

<div class="tabs vtabs" id="vtabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-v="desc">Estadística descriptiva</button><button class="tab" role="tab" aria-selected="false" data-v="hyp">Contraste de hipótesis</button></div>
<div id="v-desc">
<div class="card">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="row">
    <label>Nombre del KPI<input id="kname"></label>
    <label>Unidad<input id="kunit" placeholder="ms, %, Mbps"></label>
    <label>¿Qué es mejor?<select id="kbetter"><option value="low">Menor es mejor</option><option value="high">Mayor es mejor</option></select></label>
  </div>
  <textarea id="raw" spellcheck="false" aria-label="Datos crudos"></textarea>
  <p class="hint">Primera fila: nombres de cada sistema. Una columna por sistema, un dato por fila. Acepta pegar desde Excel (tabulador), CSV o punto y coma. Si la primera columna es «Día» o similar, se ignora.</p>
  <div class="row" style="margin:10px 0 0">
    <button class="b" id="addk">Agregar KPI</button>
    <button class="b" id="delk">Eliminar este KPI</button>
    
  </div>
  <div class="err" id="err"></div>
</div>

<div id="out"></div>
<div id="dec"></div>
</div>
<div id="v-hyp" hidden>
<div id="hform" class="card"></div>
<div id="hres"></div>
<div id="hsaved"></div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const COLORS=['--s0','--s1','--s2','--s3','--s4','--s5'];
const col=i=>`var(${COLORS[i%COLORS.length]})`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let kpis=[],cur=0;

/* ---------- estadística ---------- */
const sum=a=>a.reduce((x,y)=>x+y,0);
function pct(s,p){const h=(s.length-1)*p,l=Math.floor(h);return s[l]+(h-l)*((s[l+1]??s[l])-s[l]);}
function stats(d){
  const n=d.length;if(!n)return null;
  const s=[...d].sort((a,b)=>a-b),m=sum(d)/n;
  const v=n>1?sum(d.map(x=>(x-m)**2))/(n-1):NaN,sd=Math.sqrt(v);
  const f=new Map();d.forEach(x=>f.set(x,(f.get(x)||0)+1));
  let mo=null,mf=1;[...f].sort((a,b)=>a[0]-b[0]).forEach(([x,c])=>{if(c>mf){mf=c;mo=x;}});
  const q1=pct(s,.25),q3=pct(s,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr;
  const out=d.map((x,i)=>({x,i})).filter(o=>o.x<lo||o.x>hi);
  const inl=s.filter(x=>x>=lo&&x<=hi);
  return{n,mean:m,med:pct(s,.5),mode:mo,sd,v,min:s[0],max:s[n-1],range:s[n-1]-s[0],q1,q3,iqr,cv:m?sd/Math.abs(m)*100:NaN,
    out,wl:inl[0],wh:inl[inl.length-1]};
}
const fx=(x,k=2)=>Number.isFinite(x)?x.toLocaleString('es-MX',{minimumFractionDigits:k,maximumFractionDigits:k}):'—';

/* ---------- lectura de datos ---------- */
function parse(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const h=lines[0],sep=h.includes('\t')?'\t':h.includes(';')?';':h.includes(',')?',':/\s{2,}|\s/;
  const rows=lines.map(l=>l.split(sep).map(s=>s.trim()));
  const num=s=>parseFloat((sep===','?s:s.replace(',','.')));
  const hasH=rows[0].some(c=>c!==''&&isNaN(num(c)));
  let names=hasH?rows.shift():null,start=0;
  if(names&&/^(d[ií]a|day|n[°ºo]?|id|#|muestra|fecha|obs\w*)$/i.test(names[0])&&names.length>1)start=1;
  else if(!names&&rows.length&&rows[0].length>1&&rows.every((r,i)=>+r[0]===i+1))start=1;
  const nc=Math.max(...rows.map(r=>r.length),names?names.length:0);
  const out=[];
  for(let c=start;c<nc;c++){
    out.push({name:(names&&names[c])||`Sistema ${c-start+1}`,data:rows.map(r=>num(r[c]??'')).filter(Number.isFinite)});
  }
  return out.filter(s=>s.data.length);
}

/* ---------- muestra ---------- */
function gauss(m,s){let u=0,v=0;while(!u)u=Math.random();v=Math.random();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function sample(){
  kpis=[{"name": "Latencia", "unit": "ms", "better": "low", "raw": "Día\tProveedor A\tProveedor B\tProveedor C\n1\t41.5\t23.8\t24.9\n2\t41.2\t39.7\t23.2\n3\t30.1\t27.4\t22\n4\t37.4\t39.6\t22\n5\t40.3\t40\t22.2\n6\t39.7\t118.4\t24.2\n7\t33.9\t28.2\t26.6\n8\t35\t29.1\t21.7\n9\t39\t27.9\t21.3\n10\t33.1\t21.7\t24.8\n11\t37.2\t22\t30.7\n12\t31.2\t34.3\t20.8\n13\t38\t20.9\t20.9\n14\t32.7\t24.6\t23.1\n15\t38.3\t38\t142.3\n16\t43.5\t37.1\t22.1\n17\t43.7\t30\t24.9\n18\t42.7\t96.7\t21.2\n19\t31\t10\t18.9\n20\t40.3\t31.1\t24.7\n21\t35.6\t29.5\t22.1\n22\t32.5\t39.4\t24.9\n23\t44\t39.2\t23.9\n24\t44\t25.4\t24.6\n25\t44\t28\t22.1\n26\t36.8\t29.8\t21.2\n27\t43.4\t30.8\t21.1\n28\t23\t34.7\t24.8\n29\t36.4\t43.4\t18.4\n30\t37.9\t34.3\t24.4"}, {"name": "Velocidad de descarga", "unit": "Mbps", "better": "high", "raw": "Día\tProveedor A\tProveedor B\tProveedor C\n1\t91.8\t100\t95.1\n2\t95.5\t96.9\t95.3\n3\t86.4\t88.2\t98.3\n4\t91.6\t100\t97.6\n5\t93.4\t88.3\t96.8\n6\t88.4\t31.5\t95.6\n7\t96.7\t81\t92.9\n8\t88.9\t75.6\t97.7\n9\t89.3\t92.9\t97.4\n10\t98.1\t95.2\t95.4\n11\t89.5\t73.1\t94.2\n12\t89.5\t79.5\t96.5\n13\t89.5\t99.1\t94.5\n14\t88.5\t84.4\t95.9\n15\t84.6\t87\t38.9\n16\t94.3\t82.7\t94.2\n17\t97.6\t90.3\t95.4\n18\t90.8\t44.2\t93.9\n19\t90.9\t100\t92.9\n20\t92.1\t82.7\t94.7\n21\t91.6\t83.8\t93.6\n22\t95.5\t87.9\t97.3\n23\t96.1\t76.5\t94.7\n24\t94.8\t67.6\t94.3\n25\t89.2\t92.6\t93.9\n26\t93.7\t66.3\t95.8\n27\t92.1\t84.4\t95.5\n28\t92\t97.7\t94.7\n29\t85.9\t92.3\t91.3\n30\t88.6\t76.7\t93.9"}, {"name": "Pérdida de paquetes", "unit": "%", "better": "low", "raw": "Día\tProveedor A\tProveedor B\tProveedor C\n1\t0.28\t1.73\t0.17\n2\t0.7\t3.47\t0.16\n3\t0.72\t2.33\t0.22\n4\t0.5\t0.7\t0.44\n5\t0.5\t0.33\t0.23\n6\t0.5\t7.8\t0.33\n7\t0.26\t2.2\t0.25\n8\t0.53\t0.53\t0.29\n9\t0.1\t2.22\t0.07\n10\t0.55\t1.32\t0.36\n11\t0.81\t2.07\t0.27\n12\t0.93\t2.36\t0.15\n13\t0.44\t0.61\t0.29\n14\t0.73\t1.06\t0.25\n15\t0.53\t2.48\t6.1\n16\t0.64\t2.31\t0.26\n17\t0.54\t0.53\t0.2\n18\t0.77\t5.4\t0.13\n19\t0.58\t1.65\t0.34\n20\t0.83\t2.15\t0.21\n21\t0.64\t1.38\t0.28\n22\t0.4\t2.51\t0.12\n23\t0.43\t2\t0.17\n24\t0.64\t1.87\t0.14\n25\t0.5\t1.97\t0.33\n26\t0.61\t1.36\t0.21\n27\t0.7\t0.96\t0.27\n28\t0.26\t0.26\t0.36\n29\t0.76\t1.41\t0.45\n30\t0.24\t1\t0.22"}];
  cur=0;drawTabs();load();
}

/* ---------- gráficos SVG ---------- */
const W=640,H=310,M={l:62,r:14,t:16,b:56};
const axT=(xl,yl)=>`<text x="${M.l+(W-M.l-M.r)/2}" y="${H-6}" text-anchor="middle" style="fill:var(--ink)">${esc(xl)}</text><text transform="translate(14 ${M.t+(H-M.t-M.b)/2}) rotate(-90)" text-anchor="middle" style="fill:var(--ink)">${esc(yl)}</text>`;
const yl=k=>k.name+(k.unit?` (${k.unit})`:'');
function scale(min,max){
  if(min===max){min-=1;max+=1;}
  const step=(max-min)/4,mag=10**Math.floor(Math.log10(step)),nice=[1,2,2.5,5,10].find(k=>k*mag>=step)*mag;
  const a=Math.floor(min/nice)*nice,b=Math.ceil(max/nice)*nice,t=[];
  for(let v=a;v<=b+nice/1e6;v+=nice)t.push(+v.toFixed(10));
  return{a,b,t};
}
function frame(sc){
  const y=v=>M.t+(H-M.t-M.b)*(1-(v-sc.a)/(sc.b-sc.a));
  const g=sc.t.map(v=>`<line class="ax" x1="${M.l}" x2="${W-M.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${M.l-6}" y="${y(v)+4}" text-anchor="end">${fx(v,sc.b-sc.a<5?1:0)}</text>`).join('');
  return{y,g};
}
function barChart(ser,ss,k){
  const mx=Math.max(...ss.map(s=>s.mean));const sc=scale(0,mx*1.1),{y,g}=frame(sc);
  const bw=(W-M.l-M.r)/ser.length;
  const b=ser.map((s,i)=>{const x=M.l+bw*i+bw*.2,w=bw*.6,yy=y(ss[i].mean);
    return`<rect x="${x}" y="${yy}" width="${w}" height="${y(0)-yy}" rx="3" fill="${col(i)}"/><text x="${x+w/2}" y="${yy-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fx(ss[i].mean)}</text><text x="${x+w/2}" y="${H-30}" text-anchor="middle">${esc(s.name)}</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Media por sistema">${g}${b}${axT('Sistema','Media de '+yl(k))}</svg>`;
}
function lineChart(ser,ss,k){
  const all=ser.flatMap(s=>s.data),sc=scale(Math.min(...all),Math.max(...all)),{y,g}=frame(sc);
  const N=Math.max(...ser.map(s=>s.data.length)),x=i=>M.l+(W-M.l-M.r)*(N>1?i/(N-1):.5);
  const step=Math.ceil(N/10);let xt='';for(let i=0;i<N;i+=step)xt+=`<text x="${x(i)}" y="${H-30}" text-anchor="middle">${i+1}</text>`;
  const l=ser.map((s,k)=>`${s.data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${col(k)}" fill-opacity=".8"/>`).join('')}`+
    ss[k].out.map(o=>`<circle cx="${x(o.i)}" cy="${y(o.x)}" r="7" fill="none" stroke="${col(k)}" stroke-width="2"/><text x="${x(o.i)+10}" y="${y(o.x)+4}" style="fill:var(--ink);font-size:10px">${fx(o.x,1)}</text>`).join('')).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama de dispersión">${g}${xt}${l}${axT('Observación (n.º de día / muestra)',yl(k))}</svg>`;
}
function boxChart(ser,ss,k){
  const all=ser.flatMap(s=>s.data),sc=scale(Math.min(...all),Math.max(...all)),{y,g}=frame(sc);
  const bw=(W-M.l-M.r)/ser.length;
  const b=ser.map((s,i)=>{const t=ss[i],cx=M.l+bw*(i+.5),w=Math.min(70,bw*.5),c=col(i);
    return`<line x1="${cx}" x2="${cx}" y1="${y(t.wl)}" y2="${y(t.wh)}" stroke="${c}" stroke-width="1.5"/>
<line x1="${cx-w/4}" x2="${cx+w/4}" y1="${y(t.wl)}" y2="${y(t.wl)}" stroke="${c}" stroke-width="1.5"/><line x1="${cx-w/4}" x2="${cx+w/4}" y1="${y(t.wh)}" y2="${y(t.wh)}" stroke="${c}" stroke-width="1.5"/>
<rect x="${cx-w/2}" y="${y(t.q3)}" width="${w}" height="${Math.max(1,y(t.q1)-y(t.q3))}" fill="${c}" fill-opacity=".25" stroke="${c}" stroke-width="1.5"/>
<line x1="${cx-w/2}" x2="${cx+w/2}" y1="${y(t.med)}" y2="${y(t.med)}" stroke="${c}" stroke-width="3"/>
<circle cx="${cx}" cy="${y(t.mean)}" r="3.5" fill="var(--card)" stroke="${c}" stroke-width="1.5"/>
${t.out.map(o=>`<circle cx="${cx}" cy="${y(o.x)}" r="3.5" fill="${c}"/>`).join('')}
${[[t.q3,'Q3'],[t.med,'Med'],[t.q1,'Q1']].map(([v,n])=>`<text x="${cx+w/2+5}" y="${y(v)+4}" style="font-size:10px">${n} ${fx(v,1)}</text>`).join('')}
<text x="${cx}" y="${H-30}" text-anchor="middle">${esc(s.name)}</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama de caja y bigote">${g}${b}${axT('Sistema',yl(k))}</svg>`;
}

/* ---------- render ---------- */

/* ---------- motor de contrastes: distribuciones y decisión ---------- */
const HM=(()=>{
const G=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function lgamma(z){
  if(z<0.5)return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*z)))-lgamma(1-z);

/* gamma incompleta regularizada: devuelve [P,Q] */
function gammaPQ(a,x){
  if(x<=0)return[0,1];
  const pre=Math.exp(-x+a*Math.log(x)-lgamma(a));
  if(x<a+1){
    let ap=a,s=1/a,del=s;
    for(let n=0;n<1000;n++){ap++;del*=x/ap;s+=del;if(Math.abs(del)<Math.abs(s)*1e-16)break;}
    const P=Math.min(1,s*pre);return[P,1-P];
  }
  let b=x+1-a,c=1e300,d=1/b,h=d;
  for(let i=1;i<1000;i++){
    const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;
    c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;
    if(Math.abs(del-1)<1e-16)break;

}
function betacf(a,b,x){

  for(let m=1;m<=1000;m++){
    const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;
    const del=d*c;h*=del;if(Math.abs(del-1)<3e-16)break;
  }

function ibeta(x,a,b){

  const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;
}
/* normal */
const normSf=z=>{const q=0.5*gammaPQ(0.5,z*z/2)[1];return z>=0?q:1-q;};
const normCdf=z=>normSf(-z);
const normPdf=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
/* t de Student */
function tSf(t,v){const h=0.5*ibeta(v/(v+t*t),v/2,0.5);return t>=0?h:1-h;}

const tPdf=(x,v)=>Math.exp(lgamma((v+1)/2)-lgamma(v/2))/Math.sqrt(v*Math.PI)*Math.pow(1+x*x/v,-(v+1)/2);

    const a=S1.data,b=S2.data,n1=a.length,n2=b.length;if(n1<2||n2<2)return{err:'Cada muestra necesita al menos 2 observaciones.'};
    const A=stats(a),B=stats(b),m1=A.mean,m2=B.mean,s1=A.sd,s2=B.sd,v1=s1*s1,v2=s2*s2;
    if(!(v1>0&&v2>0))return{err:'Una de las muestras no tiene variación (s = 0): no se puede calcular el estadístico.'};
    const same=S1.ki===S2.ki,L1=same?S1.sys:`${S1.kpi} (${S1.sys})`,L2=same?S2.sys:`${S2.kpi} (${S2.sys})`,ctx=same?` de ${S1.kpi}`:'';
    const u1=ud(S1),u2=ud(S2);
    let se,df,sp2;
    if(hy.varEq){sp2=((n1-1)*v1+(n2-1)*v2)/(n1+n2-2);se=Math.sqrt(sp2*(1/n1+1/n2));df=n1+n2-2;}
    else{const q1=v1/n1,q2=v2/n2;se=Math.sqrt(q1+q2);df=(q1+q2)**2/(q1*q1/(n1-1)+q2*q2/(n2-1));}
    const stat=(m1-m2)/se,better=same?kpis[S1.ki].better:null;
    const bestL=better?((better==='low'?m1<m2:m1>m2)?L1:L2):null;
    const sub=hy.varEq
      ?[`Varianza agrupada: sp² = ((n₁−1)s₁² + (n₂−1)s₂²) / (n₁+n₂−2) = (${n1-1}·${fx(v1,4)} + ${n2-1}·${fx(v2,4)}) / ${n1+n2-2} = ${fx(sp2,4)}`,
        `Error estándar = √(sp²·(1/n₁ + 1/n₂)) = ${fx(se,4)}`,`t = (${fx(m1)} − ${fx(m2)}) / ${fx(se,4)} = ${fx(stat,4)}`]
      :[`Error estándar = √(s₁²/n₁ + s₂²/n₂) = √(${fx(v1,4)}/${n1} + ${fx(v2,4)}/${n2}) = ${fx(se,4)}`,
        `Grados de libertad (Welch) = ${fx(df,2)}`,`t = (${fx(m1)} − ${fx(m2)}) / ${fx(se,4)} = ${fx(stat,4)}`];
    return{
      name:hy.varEq?'Prueba t para dos medias, muestras independientes (varianza agrupada)':'Prueba t de Welch para dos medias, muestras independientes',
      par:{sym:'μ₁ − μ₂',words:`diferencia entre los promedios poblacionales${ctx} de ${L1} (μ₁) y ${L2} (μ₂)`},
      lhs:'μ₁ − μ₂',rhs:'0',
      h0w:tail==='two'?`los promedios${ctx} de ${L1} y ${L2} son iguales`:`el promedio${ctx} de ${L1} es ${tail==='right'?'menor':'mayor'} o igual que el de ${L2}`,
      h1w:tail==='two'?`los promedios${ctx} de ${L1} y ${L2} son diferentes`:`el promedio${ctx} de ${L1} es ${tail==='right'?'mayor':'menor'} que el de ${L2}`,
      dist:HM.mk('t',df),stat,
      just:[`Se comparan los promedios de dos grupos distintos (${L1} y ${L2}); las muestras son independientes y la variable es cuantitativa.`,
        hy.varEq?`Se supone que las dos poblaciones tienen la misma varianza (σ₁² = σ₂²), por eso se usa la varianza agrupada con n₁ + n₂ − 2 = ${df} grados de libertad.`
                :`No se supone que las varianzas sean iguales (prueba de Welch), por lo que los grados de libertad se aproximan: gl = ${fx(df,2)}.`,
        `Supuestos: observaciones independientes y poblaciones aproximadamente normales (o muestras grandes). n₁ = ${n1}, n₂ = ${n2}.`],
      data:[`Muestra 1 (${L1}): n₁ = ${n1}, ${XB}₁ = ${fx(m1)}${u1}, s₁ = ${fx(s1)}${u1}`,`Muestra 2 (${L2}): n₂ = ${n2}, ${XB}₂ = ${fx(m2)}${u2}, s₂ = ${fx(s2)}${u2}`,`Diferencia hipotética: μ₁ − μ₂ = 0`,`Nivel de significancia: α = ${g(parseFloat(hy.alpha))}`],
      formula:hy.varEq?`t = (${XB}₁ − ${XB}₂) / √(sp²·(1/n₁ + 1/n₂))`:`t = (${XB}₁ − ${XB}₂) / √(s₁²/n₁ + s₂²/n₂)`,
      subst:sub,
      prac:{
        reject:`${tail==='two'?`Los promedios${ctx} de ${L1} (${fx(m1)}${u1}) y ${L2} (${fx(m2)}${u2}) son significativamente distintos.`:`El promedio${ctx} de ${L1} (${fx(m1)}${u1}) es ${tail==='right'?'mayor':'menor'} que el de ${L2} (${fx(m2)}${u2}).`}${bestL?` ${bestL} tiene el mejor desempeño promedio.`:''}`,
        keep:`No hay diferencia significativa entre los promedios${ctx} de ${L1} (${fx(m1)}${u1}) y ${L2} (${fx(m2)}${u2}).`}
    };
  }
  case 'p1':{
    const cut=parseFloat(hy.cut);if(!isFinite(cut))return{err:'Define el criterio de éxito: escribe el valor de corte (por ejemplo, ≤ 30).'};
    const p0=parseFloat(hy.val);if(!(p0>0&&p0<1))return{err:'Escribe p₀, una proporción entre 0 y 1 (por ejemplo 0.8).'};
    const ok=okFn(),n=S1.data.length,x=S1.data.filter(ok).length,ph=x/n,se=Math.sqrt(p0*(1-p0)/n),stat=(ph-p0)/se;
    const c1=n*p0,c2=n*(1-p0),cr=critTxt(S1);
    return{
      name:'Prueba z para una proporción',
      par:{sym:'p',words:`proporción poblacional de observaciones de ${S1.kpi} en ${S1.sys} que cumplen «${cr}» (éxito)`},
      lhs:'p',rhs:g(p0),
      h0w:`la proporción de éxito («${cr}») en ${S1.sys} ${H0W[tail]} ${g(p0)} (${pcn(p0)})`,
      h1w:`la proporción de éxito («${cr}») en ${S1.sys} es ${REL[tail]} ${g(p0)} (${pcn(p0)})`,
      dist:HM.mk('z'),stat,
      just:[`La variable se convierte en categórica con dos resultados: éxito si «${cr}» y fracaso en caso contrario. Se contrasta una sola proporción contra un valor de referencia.`,
        `Supuestos: observaciones independientes y aproximación normal válida si n·p₀ ≥ 10 y n·(1 − p₀) ≥ 10. Aquí n·p₀ = ${fx(c1,1)} ${c1>=10?'✓':'✗'} y n·(1 − p₀) = ${fx(c2,1)} ${c2>=10?'✓':'✗'}.`],
      data:[`Criterio de éxito: ${cr}`,`Tamaño de muestra: n = ${n}${S1.n<S1.N?` (primeras ${n} de ${S1.N})`:''}`,`Éxitos: x = ${x}`,`Proporción muestral: ${PH} = x/n = ${x}/${n} = ${fx(ph,4)} (${pcn(ph)})`,`Proporción hipotética: p₀ = ${g(p0)}`,`Nivel de significancia: α = ${g(parseFloat(hy.alpha))}`],
      formula:`z = (${PH} − p₀) / √(p₀(1 − p₀)/n)`,
      subst:[`Error estándar = √(${g(p0)}·${g(1-p0)}/${n}) = ${fx(se,4)}`,`z = (${fx(ph,4)} − ${g(p0)}) / ${fx(se,4)} = ${fx(stat,4)}`],
      prac:{
        reject:`En ${S1.sys}, ${x} de ${n} observaciones (${pcn(ph)}) cumplen «${cr}»; la proporción ${ph>p0?'supera':'es inferior a'} la de referencia (${pcn(p0)}).`,
        keep:`En ${S1.sys}, ${x} de ${n} observaciones (${pcn(ph)}) cumplen «${cr}»; la proporción no difiere significativamente de la de referencia (${pcn(p0)}).`}
    };
  }
  case 'p2':{
    const cut=parseFloat(hy.cut);if(!isFinite(cut))return{err:'Define el criterio de éxito: escribe el valor de corte (se usa el mismo en las dos muestras).'};
    const ok=okFn(),n1=S1.data.length,n2=S2.data.length,x1=S1.data.filter(ok).length,x2=S2.data.filter(ok).length;
    const p1=x1/n1,p2=x2/n2,pc=(x1+x2)/(n1+n2);
    if(!(pc>0&&pc<1))return{err:'Con ese criterio todas (o ninguna) de las observaciones son éxito: elige otro valor de corte.'};
    const se=Math.sqrt(pc*(1-pc)*(1/n1+1/n2)),stat=(p1-p2)/se,same=S1.ki===S2.ki;
    const L1=same?S1.sys:`${S1.kpi} (${S1.sys})`,L2=same?S2.sys:`${S2.kpi} (${S2.sys})`,cr=critTxt(S1);
    const chk=[n1*pc,n1*(1-pc),n2*pc,n2*(1-pc)],chkOk=chk.every(v=>v>=5);
    return{
      name:'Prueba z para dos proporciones (muestras independientes)',
      par:{sym:'p₁ − p₂',words:`diferencia entre las proporciones poblacionales de éxito («${cr}») de ${L1} (p₁) y ${L2} (p₂)`},
      lhs:'p₁ − p₂',rhs:'0',
      h0w:tail==='two'?`la proporción de éxito («${cr}») es igual en ${L1} y en ${L2}`:`la proporción de éxito («${cr}») de ${L1} es ${tail==='right'?'menor':'mayor'} o igual que la de ${L2}`,
      h1w:tail==='two'?`la proporción de éxito es diferente entre ${L1} y ${L2}`:`la proporción de éxito de ${L1} es ${tail==='right'?'mayor':'menor'} que la de ${L2}`,
      dist:HM.mk('z'),stat,
      just:[`Se comparan las proporciones de éxito («${cr}») de dos grupos independientes. La variable se convierte en categórica (éxito / fracaso) con el mismo criterio en ambas muestras.`,
        `Bajo H₀ las dos proporciones son iguales, por lo que se usa la proporción combinada ${PH}c = (x₁ + x₂)/(n₁ + n₂).`,
        `Supuestos: muestras independientes y n₁·${PH}c, n₁(1 − ${PH}c), n₂·${PH}c, n₂(1 − ${PH}c) ≥ 5. Valores: ${chk.map(v=>fx(v,1)).join(', ')} ${chkOk?'✓':'✗'}.`],
      data:[`Criterio de éxito (mismo en ambas muestras): ${cr}`,`Muestra 1 (${L1}): n₁ = ${n1}, x₁ = ${x1}, ${PH}₁ = ${fx(p1,4)} (${pcn(p1)})`,`Muestra 2 (${L2}): n₂ = ${n2}, x₂ = ${x2}, ${PH}₂ = ${fx(p2,4)} (${pcn(p2)})`,`Proporción combinada: ${PH}c = (${x1} + ${x2}) / (${n1} + ${n2}) = ${fx(pc,4)}`,`Nivel de significancia: α = ${g(parseFloat(hy.alpha))}`],
      formula:`z = (${PH}₁ − ${PH}₂) / √(${PH}c(1 − ${PH}c)(1/n₁ + 1/n₂))`,
      subst:[`Error estándar = √(${fx(pc,4)}·${fx(1-pc,4)}·(1/${n1} + 1/${n2})) = ${fx(se,4)}`,`z = (${fx(p1,4)} − ${fx(p2,4)}) / ${fx(se,4)} = ${fx(stat,4)}`],
      prac:{
        reject:`${L1}: ${pcn(p1)}; ${L2}: ${pcn(p2)}. ${tail==='two'?`La proporción de cumplimiento de «${cr}» es distinta; ${p1>p2?L1:L2} cumple con más frecuencia.`:`La proporción de cumplimiento de «${cr}» de ${L1} es ${tail==='right'?'mayor':'menor'} que la de ${L2}.`}`,
        keep:`${L1}: ${pcn(p1)}; ${L2}: ${pcn(p2)}. No hay diferencia significativa en la proporción de cumplimiento de «${cr}».`}
    };
  }
  case 'v1':{
    const n=S1.data.length;if(n<2)return{err:'Se necesitan al menos 2 observaciones (n ≥ 2).'};
    const s02=parseFloat(hy.val);if(!(s02>0))return{err:'Escribe σ₀², la varianza hipotética (mayor que 0).'};
    const st=stats(S1.data),s2=st.v;if(!(s2>0))return{err:'Todas las observaciones son iguales (s² = 0): no se puede calcular el estadístico.'};
    const stat=(n-1)*s2/s02,u2=S1.unit?' '+S1.unit+'²':'',loc=`${S1.kpi} en ${S1.sys}`;
    const more=s2>s02;
    return{
      name:'Prueba χ² (chi-cuadrada) para una varianza',
      par:{sym:'σ²',words:`varianza poblacional de ${S1.kpi}${S1.unit?` (${S1.unit}²)`:''} en ${S1.sys} (mide la variabilidad o estabilidad)`},
      lhs:'σ²',rhs:g(s02),
      h0w:`la varianza de ${loc} ${H0W[tail]} ${g(s02)}${u2}`,
      h1w:`la varianza de ${loc} es ${REL[tail]} ${g(s02)}${u2}${tail==='right'?' (hay más variabilidad)':tail==='left'?' (hay menos variabilidad)':''}`,
      dist:HM.mk('chi',n-1),stat,
      just:[`Se contrasta la variabilidad de una sola población (${loc}) contra un valor de referencia; la variable es cuantitativa.`,
        `El estadístico χ² = (n − 1)s² / σ₀² sigue una distribución chi-cuadrada con n − 1 = ${n-1} grados de libertad.`,
        `Supuestos: observaciones independientes y población normal.`],
      data:[`Tamaño de muestra: n = ${n}${S1.n<S1.N?` (primeras ${n} de ${S1.N})`:''}`,`Varianza muestral: s² = ${fx(s2,4)}${u2} (s = ${fx(st.sd)}${ud(S1)})`,`Varianza hipotética: σ₀² = ${g(s02)}${u2}`,`Nivel de significancia: α = ${g(parseFloat(hy.alpha))}`],
      formula:'χ² = (n − 1)·s² / σ₀²',
      subst:[`χ² = (${n} − 1)·${fx(s2,4)} / ${g(s02)} = ${fx(stat,4)}`],
      prac:{
        reject:`La varianza observada de ${loc} (s² = ${fx(s2,4)}) ${more?'supera':'es inferior a'} la hipotética (σ₀² = ${g(s02)}).`,
        keep:`La varianza observada de ${loc} (s² = ${fx(s2,4)}) no difiere significativamente de la hipotética (σ₀² = ${g(s02)}).`}
    };
  }
  case 'v2':{
    const a=S1.data,b=S2.data,n1=a.length,n2=b.length;if(n1<2||n2<2)return{err:'Cada muestra necesita al menos 2 observaciones.'};
    const A=stats(a),B=stats(b),v1=A.v,v2=B.v;if(!(v1>0&&v2>0))return{err:'Una de las muestras no tiene variación (s² = 0): no se puede calcular el estadístico.'};
    const stat=v1/v2,same=S1.ki===S2.ki,L1=same?S1.sys:`${S1.kpi} (${S1.sys})`,L2=same?S2.sys:`${S2.kpi} (${S2.sys})`,ctx=same?` de ${S1.kpi}`:'';
    const stab=v1<v2?L1:L2;
    return{
      name:'Prueba F para la razón de dos varianzas',
      par:{sym:'σ₁² / σ₂²',words:`razón entre las varianzas poblacionales${ctx} de ${L1} (σ₁²) y ${L2} (σ₂²)`},
      lhs:'σ₁² / σ₂²',rhs:'1',
      h0w:tail==='two'?`la variabilidad${ctx} de ${L1} y ${L2} es igual (σ₁² = σ₂²)`:`la variabilidad${ctx} de ${L1} es ${tail==='right'?'menor':'mayor'} o igual que la de ${L2} (σ₁² ${tail==='right'?'≤':'≥'} σ₂²)`,
      h1w:tail==='two'?`la variabilidad${ctx} de ${L1} y ${L2} es diferente (σ₁² ≠ σ₂²)`:`la variabilidad${ctx} de ${L1} es ${tail==='right'?'mayor':'menor'} que la de ${L2}`,
      dist:HM.mk('f',n1-1,n2-1),stat,
      just:[`Se comparan las varianzas (variabilidad) de dos grupos independientes (${L1} y ${L2}); la variable es cuantitativa.`,
        `El estadístico F = s₁² / s₂² sigue una distribución F con (n₁ − 1, n₂ − 1) = (${n1-1}, ${n2-1}) grados de libertad.`,
        `Supuestos: muestras independientes y poblaciones normales.`],
      data:[`Muestra 1 (${L1}): n₁ = ${n1}, s₁² = ${fx(v1,4)}${S1.unit?' '+S1.unit+'²':''}`,`Muestra 2 (${L2}): n₂ = ${n2}, s₂² = ${fx(v2,4)}${S2.unit?' '+S2.unit+'²':''}`,`Razón hipotética: σ₁² / σ₂² = 1`,`Nivel de significancia: α = ${g(parseFloat(hy.alpha))}`],
      formula:'F = s₁² / s₂²',
      subst:[`F = ${fx(v1,4)} / ${fx(v2,4)} = ${fx(stat,4)}`],
      prac:{
        reject:`Varianzas muestrales: ${L1}, s² = ${fx(v1,4)}; ${L2}, s² = ${fx(v2,4)}. ${tail==='two'?'La variabilidad es distinta':`La variabilidad de ${L1} es ${tail==='right'?'mayor':'menor'} que la de ${L2}`}; ${stab} presenta menor variabilidad.`,
        keep:`Varianzas muestrales: ${L1}, s² = ${fx(v1,4)}; ${L2}, s² = ${fx(v2,4)}. No hay diferencia significativa en la variabilidad.`}
    };
  }}
}

/* ---------- gráfica de la zona de rechazo ---------- */
function distSvg(d,stat,r,alpha,tail){
  const Wd=W,Hd=H,m={l:46,r:18,t:54,b:62},pw=Wd-m.l-m.r,ph=Hd-m.t-m.b,base=Hd-m.b;
  let x0,x1;
  if(d.sym){const lim=Math.max(4,Math.abs(stat)*1.15,Math.abs(r.lo||0)*1.25,Math.abs(r.hi||0)*1.25);x0=-lim;x1=lim;}
  else{
    x1=Math.max(d.q(0.995),stat*1.15,(r.hi||0)*1.2);
    const big=d.type==='chi'?d.a>=8:(d.a>=8&&d.b>=8);
    x0=big?d.q(0.0005)*0.8:0;
    x0=Math.min(x0,stat*0.85,r.lo&&r.lo>0?r.lo*0.85:x0);x0=Math.max(0,x0);
  }
  const N=260,xs=[],ys=[];let ymax=0;
  for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;xs.push(x);const y=d.pdf(x);ys.push(y);if(Number.isFinite(y)&&x>=x0+(x1-x0)*0.01)ymax=Math.max(ymax,y);}
  ymax*=1.1;
  const xx=v=>m.l+pw*(v-x0)/(x1-x0),yy=v=>m.t+ph*(1-Math.min(Math.max(v,0),ymax)/ymax);
  const curve=xs.map((x,i)=>`${i?'L':'M'}${xx(x).toFixed(1)},${yy(ys[i]).toFixed(1)}`).join(' ');
  const region=(a,b)=>{
    a=Math.max(a,x0);b=Math.min(b,x1);if(!(b>a))return'';
    const k=80,pts=[];for(let i=0;i<=k;i++){const x=a+(b-a)*i/k;pts.push(`L${xx(x).toFixed(1)},${yy(d.pdf(x)).toFixed(1)}`);}
    return`<path d="M${xx(a).toFixed(1)},${yy(0)} ${pts.join(' ')} L${xx(b).toFixed(1)},${yy(0)} Z" fill="#c0392b" fill-opacity=".38"/>`;
  };
  const RED='#c0392b',GRN='#2e9e5b',vc=r.inReg?RED:GRN,s=d.s;
  const sx=Math.min(Math.max(xx(stat),m.l),Wd-m.r);
  let shade='',crit='';
  if(r.lo!==null){shade+=region(x0,r.lo);crit+=`<line x1="${xx(r.lo)}" x2="${xx(r.lo)}" y1="${m.t}" y2="${base}" stroke="${RED}" stroke-width="1.3" stroke-dasharray="4 3"/><text x="${sx>=xx(r.lo)&&sx<=xx(r.lo)+100?xx(r.lo)-5:xx(r.lo)+5}" y="${m.t+10}" text-anchor="${sx>=xx(r.lo)&&sx<=xx(r.lo)+100?'end':'start'}" style="fill:${RED};font-size:11px">${s} crít = ${fx(r.lo,3)}</text>`;}
  if(r.hi!==null){shade+=region(r.hi,x1);crit+=`<line x1="${xx(r.hi)}" x2="${xx(r.hi)}" y1="${m.t}" y2="${base}" stroke="${RED}" stroke-width="1.3" stroke-dasharray="4 3"/><text x="${sx<=xx(r.hi)&&sx>=xx(r.hi)-100?xx(r.hi)+5:xx(r.hi)-5}" y="${m.t+10}" text-anchor="${sx<=xx(r.hi)&&sx>=xx(r.hi)-100?'start':'end'}" style="fill:${RED};font-size:11px">${s} crít = ${fx(r.hi,3)}</text>`;}
  const stLine=`<line x1="${sx}" x2="${sx}" y1="${m.t-8}" y2="${base}" stroke="${vc}" stroke-width="2.4"/><circle cx="${sx}" cy="${base}" r="4" fill="${vc}"/><text x="${Math.min(Math.max(sx,m.l+46),Wd-m.r-46)}" y="${m.t-16}" text-anchor="middle" style="fill:${vc};font-size:12px;font-weight:700">${s} = ${fx(stat,3)}</text>`;
  const tk=scale(x0,x1).t.filter(v=>v>=x0-1e-9&&v<=x1+1e-9);
  const ticks=tk.map(v=>`<line x1="${xx(v)}" x2="${xx(v)}" y1="${base}" y2="${base+4}" class="ax"/><text x="${xx(v)}" y="${base+16}" text-anchor="middle">${g(v)}</text>`).join('');
  const verdict=r.inReg?`El estadístico cae en la región de rechazo → se rechaza H₀`:`El estadístico no cae en la región de rechazo → no se rechaza H₀`;
  return`<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Zona de rechazo y decisión">
<text x="${m.l}" y="16" style="fill:var(--ink);font-size:12px;font-weight:700">${esc(d.name)} · α = ${g(alpha)} · ${TAILN[tail]}</text>
<line x1="${m.l}" x2="${Wd-m.r}" y1="${base}" y2="${base}" class="ax"/>
${shade}<path d="${curve}" fill="none" stroke="var(--s0)" stroke-width="2"/>${crit}${stLine}${ticks}
<text x="${m.l+pw/2}" y="${base+32}" text-anchor="middle" style="fill:var(--ink)">Valores del estadístico ${s}</text>
<rect x="${m.l}" y="${base+40}" width="11" height="11" fill="#c0392b" fill-opacity=".38"/><text x="${m.l+16}" y="${base+50}">Región de rechazo (área = α)</text>
<text x="${Wd-m.r}" y="${base+50}" text-anchor="end" style="fill:${vc};font-size:12px;font-weight:700">${verdict}</text>
</svg>`;
}

/* ---------- los 13 pasos ---------- */
function finish(sp,S1,S2,alpha,q){
  const tail=hy.tail,d=sp.dist,r=HM.decide(d,sp.stat,tail,alpha),s=d.s,rej=r.reject,A=g(alpha);
  const rel={two:'≠',right:'>',left:'<'}[tail],rel0={two:'=',right:'≤',left:'≥'}[tail];
  const dfTxt=d.type==='z'?'':d.type==='f'?`gl = (${g(d.a)}, ${g(d.b)})`:`gl = ${Number.isInteger(d.a)?d.a:fx(d.a,2)}`;
  const region=d.sym
    ?(tail==='two'?`Rechazar H₀ si ${s} < ${fx(r.lo,4)} o ${s} > ${fx(r.hi,4)}`:tail==='right'?`Rechazar H₀ si ${s} > ${fx(r.hi,4)}`:`Rechazar H₀ si ${s} < ${fx(r.lo,4)}`)
    :(tail==='two'?`Rechazar H₀ si ${s} < ${fx(r.lo,4)} o ${s} > ${fx(r.hi,4)}`:tail==='right'?`Rechazar H₀ si ${s} > ${fx(r.hi,4)}`:`Rechazar H₀ si ${s} < ${fx(r.lo,4)}`);
  const critTxt2=tail==='two'?(d.sym?`${s} crítico = ±${fx(r.hi,4)}`:`${s} crítico inferior = ${fx(r.lo,4)}; ${s} crítico superior = ${fx(r.hi,4)}`):`${s} crítico = ${fx(tail==='right'?r.hi:r.lo,4)}`;
  const svg=distSvg(d,sp.stat,r,alpha,tail);
  const pr=hy.preset?PRESETS.find(x=>x.id===hy.preset):null;
  const jl=pr&&pr.type===hy.type?[pr.just,...(pr.jf?[{f:pr.jf}]:[])]:[sp.name,...sp.just];
  const pn=r.p<0.0001?'p < 0.0001':`p = ${pf(r.p,alpha)}`;
  const cmp=r.p<0.0001?`p < 0.0001 y α = ${A}`:`${pf(r.p,alpha)} ${rej?'<':'≥'} ${A}`;
  const steps=[
    {title:'Pregunta de investigación',lines:[q]},
    {title:'Parámetro poblacional de interés',lines:[`${sp.par.sym}: ${sp.par.words}.`]},
    {title:'Hipótesis nula y alternativa',lines:[{f:`H₀: ${sp.lhs} ${rel0} ${sp.rhs}`},`H₀: ${sp.h0w}.`,{f:`H₁: ${sp.lhs} ${rel} ${sp.rhs}`},`H₁: ${sp.h1w}.`]},
    {title:'Tipo de prueba',lines:[tail==='two'?'Bilateral / Dos colas.':tail==='right'?'Unilateral, cola derecha.':'Unilateral, cola izquierda.']},
    {title:'Nivel de significancia',lines:[`α = ${A}`,`N.C. = ${g(1-alpha)}`]},
    {title:'Prueba elegida y justificación',lines:jl},
    {title:'Datos, fórmula y sustitución',lines:[...sp.data,{f:sp.formula},...sp.subst.map(t=>({f:t}))]},
    {title:'Estadístico de prueba, valor p y valor crítico',lines:[`Estadístico de prueba: ${s} = ${fx(sp.stat,4)}${dfTxt?` (${dfTxt})`:''}`,`Valor ${pn}`,`${critTxt2}`,`Región de rechazo: ${region}.`,`Comparación: ${rej?'valor p < α':'valor p ≥ α'} (${cmp}), por lo tanto ${rej?'se rechaza':'no se rechaza'} H₀.`]},
    {title:'Gráfica',lines:[],graph:true},
    {title:'Decisión',lines:[`El estadístico de prueba (${s} = ${fx(sp.stat,4)}) se encuentra ${rej?'dentro de la zona de rechazo, por lo tanto se rechaza':'fuera de la zona de rechazo, por lo tanto no se rechaza'} H₀.`],verdict:rej?'rej':'keep'},
    {title:'Conclusiones',lines:[`Conclusión estadística: Con un nivel de significancia de ${A}, ${rej?'hay':'no hay'} evidencia estadística suficiente para afirmar que ${sp.h1w}.`,`Conclusión práctica: ${rej?sp.prac.reject:sp.prac.keep}`]},
    {title:'Error tipo I',lines:[`Rechazar H₀ cuando es verdadera: concluir que ${sp.h1w} cuando en realidad ${sp.h0w}. Probabilidad de cometerlo: α = ${A} (${pcn(alpha)}).`]},
    {title:'Error tipo II',lines:[`No rechazar H₀ cuando es falsa: concluir que ${sp.h0w} cuando en realidad ${sp.h1w}. Probabilidad de cometerlo: β.`]}
  ];
  const dc=hy.preset&&DOC[hy.preset];
  steps[11].title='Error Tipo I';steps[12].title='Error Tipo II';
  steps[6].fd={d:sp.data,f:sp.formula,s:sp.subst,dt:(DOC[hy.preset]||{}).dt};
  if(hy.preset==='p2'&&S2){
    const n1=S1.data.length,n2=S2.data.length,A1=stats(S1.data),B1=stats(S2.data),u=S1.unit?' '+S1.unit:'',Sp='S<sub>p</sub>';
    const sp2=((n1-1)*A1.v+(n2-1)*B1.v)/(n1+n2-2),spv=Math.sqrt(sp2),tt=(A1.mean-B1.mean)/(spv*Math.sqrt(1/n1+1/n2));
    const sq=`√(${fr('1','n₁')} + ${fr('1','n₂')})`,sq2=`√(${fr('1',n1)} + ${fr('1',n2)})`;
    const L=(x,c)=>`<div class="mx${c?' res':''}">${x}</div>`;
    steps[6].fd.hf=L(`t<sub>cal</sub> <b>=</b> ${frh('x̄₁ − x̄₂',`${Sp}·${sq}`)}`)+L(`${Sp} <b>=</b> √${Sp}²`)+L(`${Sp}² <b>=</b> ${frh('(n₁ − 1)·s₁² + (n₂ − 1)·s₂²','n₁ + n₂ − 2')}`);
    steps[6].fd.hs=L(`${Sp}² <b>=</b> ${frh(`(${n1} − 1)·${fx(A1.sd,3)}² + (${n2} − 1)·${fx(B1.sd,3)}²`,`${n1} + ${n2} − 2`)} <b>=</b> ${fx(sp2,3)}${u?u+'²':''}`)+L(`${Sp} <b>=</b> √${fx(sp2,3)} <b>=</b> ${fx(spv,2)}${u}`)+L(`t<sub>cal</sub> <b>=</b> ${frh(`${fx(A1.mean,3)} − ${fx(B1.mean,3)}`,`${fx(spv,2)}·${sq2}`)} <b>=</b> ${fx(tt,3)}`,1);
    steps[6].fd.hg=welchHtml+`<div class="fb"><div class="mx res">gl <b>=</b> ${fx(d.a,2)}</div></div>`;
  }
  const cv=tail==='two'?(d.sym?'±'+fx(r.hi,4):fx(r.lo,4)+' y '+fx(r.hi,4)):fx(tail==='right'?r.hi:r.lo,4);
  steps[7].cd={k:[['Estadístico '+s+' calculado',fx(sp.stat,4)],...(dfTxt?[['Grados de libertad',dfTxt.replace('gl = ','')]]:[]),['Valor p',r.p<0.0001?'< 0.0001':pf(r.p,alpha)],['Valor crítico '+s,cv],['Nivel de significancia α',A]],reg:region,cmp:`valor p = ${r.p<0.0001?'< 0.0001':pf(r.p,alpha)}  ${rej?'<':'≥'}  α = ${A}`,rej};
  if(dc){steps[2].lines=[{f:'H₀: '+dc.h0},{f:'H₁: '+dc.h1}];steps[1].lines=dc.pa;steps[9].lines=[dc.dd];steps[9].verdict='';steps[10].lines=['Conclusión Estadística: '+dc.cs,'Conclusión Práctica: '+dc.cp];steps[11].lines=[dc.e1];steps[12].lines=[dc.e2];}
  const tn=TYPES.find(t=>t.id===hy.type).name;
  const row={type:hy.type,typeName:tn,test:sp.name,h0:`${sp.lhs} ${rel0} ${sp.rhs}`,h1:`${sp.lhs} ${rel} ${sp.rhs}`,tail,alpha,sname:s,stat:sp.stat,df:dfTxt,p:r.p,reject:rej};
  if(dc){row.h0=dc.h0;row.h1=dc.h1;}
  return{ok:true,steps,svg,row,verdict:rej};
}
const fr=(n,d)=>`<span class="fr"><span>${esc(n)}</span><span>${esc(d)}</span></span>`;
const unp=t=>{if(t[0]!=='('||t[t.length-1]!==')')return t;let k=0;for(let i=0;i<t.length;i++){k+=t[i]==='('?1:t[i]===')'?-1:0;if(!k&&i<t.length-1)return t;}return t.slice(1,-1);};
function mth(t){return t.split(' = ').map(p=>{let k=0,at=-1;for(let i=0;i<p.length-2;i++){k+=p[i]==='('?1:p[i]===')'?-1:0;if(!k&&p.substr(i,3)===' / ')at=i;}return at<0?esc(p):fr(unp(p.slice(0,at)),unp(p.slice(at+3)));}).join(' <b>=</b> ');}
const fdHtml=f=>`<div class="dg">${f.dt?f.dt.map(([a,b])=>`<div class="dc"><span>${a}</span><b>${b}</b></div>`).join(''):f.d.filter(l=>!/^(Diferencia|Razón) hipotética/.test(l)).map(l=>{const i=l.indexOf(': ');return i<0?`<div class="dc"><span>${esc(l)}</span></div>`:`<div class="dc"><span>${esc(l.slice(0,i))}</span><b>${esc(l.slice(i+2))}</b></div>`;}).join('')}</div>${f.hf?`<div class="fb"><span class="fl">Fórmulas</span>${f.hf}</div><div class="fb"><span class="fl">Sustitución</span>${f.hs}</div>${f.hg}`:`<div class="fb"><span class="fl">Fórmula</span><div class="mx">${mth(f.f)}</div></div><div class="fb"><span class="fl">Sustitución y resultado</span>${f.s.filter(l=>!l.startsWith('Error estándar')).map((l,i,a)=>`<div class="mx${i===a.length-1?' res':''}">${mth(l)}</div>`).join('')}</div>`}`;
const cdHtml=c=>`<div class="dg">${c.k.map(([a,b],i)=>`<div class="dc"${i===0?' style="border-color:var(--acc)"':''}><span>${esc(a)}</span><b style="font-size:1.25rem">${esc(b)}</b></div>`).join('')}</div><div class="fb"><span class="fl">Región de rechazo</span><div class="mx">${esc(c.reg)}</div></div><div class="fb"><span class="fl">Comparación</span><div class="mx">${esc(c.cmp)} <span class="vd ${c.rej?'rej':'keep'}" style="margin:0">${c.rej?'Se rechaza H₀':'No se rechaza H₀'}</span></div></div>`;
const frh=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const welchHtml=`<div class="fb"><span class="fl">Grados de libertad (Welch)</span><div class="mx">gl <b>=</b> ${frh(`(${fr('s₁²','n₁')} + ${fr('s₂²','n₂')})²`,`${frh(`(${fr('s₁²','n₁')})²`,'n₁ − 1')} + ${frh(`(${fr('s₂²','n₂')})²`,'n₂ − 1')}`)}</div></div>`;
function stepsHtml(o){
  return`<ol class="steps">${o.steps.map(st=>`<li><b>${esc(st.title)}</b>${st.fd?fdHtml(st.fd):st.cd?cdHtml(st.cd):st.lines.map(l=>typeof l==='string'?(/^Conclusión (Estadística|Práctica):/.test(l)?`<p><b>${esc(l.slice(0,l.indexOf(':')+1))}</b>${esc(l.slice(l.indexOf(':')+1))}</p>`:`<p>${esc(l)}</p>`):l.f.startsWith('gl = (s₁²/n₁')?welchHtml:`<p><span class="fm">${esc(l.f)}</span></p>`).join('')}${st.graph?`<div class="hg">${o.svg}</div>`:''}${st.verdict?`<div class="vd ${st.verdict}">${st.verdict==='rej'?'Se rechaza H₀':'No se rechaza H₀'}</div>`:''}</li>`).join('')}</ol>`;
}

/* ---------- cálculo y render ---------- */
function compute(){
  const two=isTwo(),alpha=parseFloat(hy.alpha);
  const S1=pick(hy.s1,hy.n1),S2=two?pick(hy.s2,hy.n2):null;
  const q=hy.qDirty&&hy.q.trim()?hy.q.trim():autoQ(S1,S2);
  if(!S1||(two&&!S2))return{err:'No hay datos para analizar. Captura tus datos en la pestaña «Estadística descriptiva».',q};
  if(two&&S1.key===S2.key)return{err:'Elige dos muestras distintas (otro sistema u otro KPI).',q};
  if(!(alpha>0&&alpha<1))return{err:'Elige un nivel de significancia entre 0 y 1.',q};
  const sp=buildSpec(S1,S2);if(sp.err)return{err:sp.err,q};
  const o=finish(sp,S1,S2,alpha,q);o.q=q;return o;
}
function result(){}
const SELOPT=(o,sel)=>o.map(s=>`<option value="${s.key}"${s.key===sel?' selected':''}>${esc(s.kpi)} · ${esc(s.sys)} (N = ${s.data.length})</option>`).join('');
function fixKeys(){
  const o=srcs();if(!o.length)return o;
  if(!o.some(s=>s.key===hy.s1))hy.s1=o[0].key;
  if(!o.some(s=>s.key===hy.s2)||hy.s2===hy.s1){const a=o.find(s=>s.key===hy.s1),alt=o.find(s=>s.key!==hy.s1&&s.ki===a.ki)||o.find(s=>s.key!==hy.s1);hy.s2=alt?alt.key:hy.s1;}
  return o;
}
function drawForm(){
  const sel=hy.sel||'all';
  const card=(id,n,t,sub)=>`<button type="button" class="pk${id===sel?' on':''}" data-sel="${id}" aria-pressed="${id===sel}"><span class="pn">${n}</span><span class="pt">${esc(t)}</span><span class="ps">${esc(sub)}</span></button>`;
  $('hform').innerHTML=`<h2>Tipo de problema</h2><div class="pg">${card('all','★','Informe completo','Los 6 problemas')}${PRESETS.map((p,i)=>card(p.id,i+1,TYPES.find(t=>t.id===p.type).name,p.label.split(' · ').slice(2).join(' · '))).join('')}</div>${hy.presetMsg?`<p class="err">${esc(hy.presetMsg)}</p>`:''}`;
}
function drawSaved(){
  const el=$('hsaved'),sel=hy.sel||'all';
  const tbl=`<div class="tw"><table><tr><th>#</th><th>Prueba</th><th>H₀ / H₁</th><th>α</th><th>Estadístico</th><th>Valor p</th><th>Decisión</th></tr>${saved.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.row.typeName)}</td><td style="text-align:left">${esc(s.row.h0)} / ${esc(s.row.h1)}</td><td>${g(s.row.alpha)}</td><td>${esc(s.row.sname)} = ${fx(s.row.stat,3)}</td><td>${pf(s.row.p,s.row.alpha)}</td><td>${s.row.reject?'Rechazar H₀':'No rechazar H₀'}</td></tr>`).join('')}</table></div>`;
  const one=saved.find(x=>x.preset===sel),oi=saved.indexOf(one);
  const det=one?`<div id="d_${one.preset}" style="margin-top:16px"><h2>Problema ${oi+1}: ${esc(one.row.typeName)} · ${one.row.reject?'se rechaza H₀':'no se rechaza H₀'}</h2>${one.html}</div>`:'';
  el.innerHTML=`<div class="card"><h2>Informe de contrastes (${saved.length} de 6)</h2>${tbl}${det}<div class="row" style="margin:10px 0 0"><button class="b" id="h_pdf"${saved.length?'':' disabled'}>Descargar informe en PDF</button></div><div class="cap" id="hmsg" role="status"></div></div>`;
}
function solve(){
  const keep=Object.assign({},hy),fail=[];saved=[];
  PRESETS.forEach(p=>{if(!applyPreset(p)){fail.push(p.label);return;}const o=compute();if(!o.ok){fail.push(p.label+' ('+o.err+')');return;}saved.push({id:p.id,preset:p.id,row:o.row,steps:o.steps,svg:o.svg,html:stepsHtml(o)});});
  Object.assign(hy,keep);hy.presetMsg=fail.length?'No se pudieron resolver: '+fail.join('; ')+'. Revisa los nombres de KPI y sistemas en «Estadística descriptiva».':'';
}
function hyRefresh(){solve();drawForm();drawSaved();}
window.hyRefresh=hyRefresh;

/* ---------- eventos ---------- */
$('hform').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-sel]');if(!b)return;hy.sel=b.dataset.sel;drawForm();drawSaved();const d=$('d_'+hy.sel);if(d&&d.scrollIntoView)d.scrollIntoView({behavior:'smooth',block:'start'});});
$('hres').addEventListener('click',e=>{
  if(e.target.id!=='h_save'||!last)return;
  saved.push({id:Date.now()+Math.random(),row:last.row,steps:last.steps,svg:last.svg,html:stepsHtml(last)});
  persist();drawSaved();confirmDel=false;
  const m=$('hmsg2');if(m)m.textContent=`Guardado como contraste ${saved.length}. Aparece abajo, en el informe.`;
});
$('hsaved').addEventListener('click',e=>{
  const id=e.target.id,del=e.target.dataset&&e.target.dataset.del;
  if(del){saved=saved.filter(s=>String(s.id)!==del);persist();confirmDel=false;drawSaved();}
  else if(id==='h_clear'){if(!confirmDel){confirmDel=true;drawSaved();}else{saved=[];persist();confirmDel=false;drawSaved();}}
  else if(id==='h_pdf')hyPdf();
});
document.addEventListener('click',e=>{if(confirmDel&&e.target.id!=='h_clear'){confirmDel=false;if($('h_clear'))drawSaved();}});
$('vtabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  const v=b.dataset.v;
  [...$('vtabs').children].forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  $('v-desc').hidden=v!=='desc';$('v-hyp').hidden=v!=='hyp';
  if(v==='hyp')hyRefresh();
});

/* ---------- PDF del informe ---------- */
const PM=[[/μ/g,'mu'],[/σ/g,'sigma'],[/α/g,'alfa'],[/β/g,'beta'],[/χ/g,'chi'],[/≠/g,'!='],[/≤/g,'<='],[/≥/g,'>='],[/−/g,'-'],[/[–—]/g,'-'],[/₀/g,'0'],[/₁/g,'1'],[/₂/g,'2'],
  [/x̄/g,'x-barra'],[/p̂/g,'p^'],[/√/g,'raiz '],[/→/g,'->'],[/✓/g,'(ok)'],[/✗/g,'(no)'],[/⚠/g,'(!)'],[/○/g,'-'],[/…/g,'...'],[/≈/g,'~']];
const pdfTxt=s=>{let t=String(s);PM.forEach(([a,b])=>{t=t.replace(a,b);});return t.replace(/[^\x00-\xFF]/g,'?');};
async function hyPdf(){
  const msg=t=>{const m=$('hmsg');if(m)m.textContent=t;};
  if(!saved.length){msg('Guarda al menos un contraste.');return;}
  if(!window.jspdf){msg('No se pudo cargar la librería de PDF.');return;}
  msg('Generando PDF…');
  try{
    const d=new window.jspdf.jsPDF({unit:'pt',format:'letter'}),X=40,CW=532,BOT=748;let y=56;
    const need=h=>{if(y+h>BOT){d.addPage();y=50;}};
    const para=(txt,size=10,bold=false,ind=0)=>{d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(size);
      d.splitTextToSize(pdfTxt(txt),CW-ind).forEach(l=>{need(size*1.4);d.text(l,X+ind,y);y+=size*1.4;});};
    para('Contraste de hipótesis - Informe de resultados',16,true);y+=2;
    para(new Date().toLocaleDateString('es-MX'),9);y+=8;
    para('Resumen de contrastes',12,true);
    saved.forEach((s,i)=>{const r=s.row;para(`${i+1}. ${r.typeName}: H0: ${r.h0}  vs  H1: ${r.h1}  |  alfa = ${g(r.alpha)}  |  ${r.sname} = ${fx(r.stat,3)}  |  p ${pS(r.p,r.alpha)}  |  ${r.reject?'Rechazar H0':'No rechazar H0'}`,9,false,6);});
    for(let i=0;i<saved.length;i++){
      const s=saved[i];d.addPage();y=50;
      para(`Contraste ${i+1}: ${s.row.typeName}`,14,true);y+=4;
      for(let k=0;k<s.steps.length;k++){
        const st=s.steps[k];y+=4;para(`${k+1}. ${st.title}`,10.5,true);
        st.lines.forEach(l=>para(typeof l==='string'?l:l.f,9.5,false,10));
        if(st.graph){const hh=400*H/W;need(hh+10);d.addImage(await png(s.svg),'PNG',X+10,y+2,400,hh);y+=hh+10;}
      }
    }
    await dl('informe_contrastes_hipotesis.pdf',d.output('blob'));
    msg('PDF listo.');
  }catch(e){msg('No se pudo generar el PDF.');}
}
})();
